# Self-signed issuer: works anywhere (kind, minikube) with no public DNS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# Let's Encrypt issuer for a real, publicly reachable domain.
# To use it: change EMAIL, set `issuerRef.name: letsencrypt-prod` in
# certificate.yaml and put your real domain in dnsNames and the ingress host.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
